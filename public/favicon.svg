<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="nablaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="#08090D" />
  <rect width="98" height="98" x="1" y="1" rx="23" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1.5" />
  
  <!-- Nabla (∇) inverted triangle symbol with AI gradient split -->
  <!-- Left arm (Nabla - white) -->
  <path d="M 22 28 L 50 78 L 44 78 L 18 32 Z" fill="#FFFFFF" />
  <!-- Top bar left -->
  <path d="M 20 28 L 50 28 L 50 34 L 20 34 Z" fill="#FFFFFF" />
  
  <!-- Right arm (Ai - purple gradient with glow) -->
  <path d="M 50 78 L 78 28 L 82 32 L 56 78 Z" fill="url(#nablaGrad)" filter="url(#glow)" />
  <!-- Top bar right -->
  <path d="M 50 28 L 80 28 L 80 34 L 50 34 Z" fill="#8B5CF6" />
  
  <!-- Central AI spark core -->
  <circle cx="50" cy="46" r="4.5" fill="#A855F7" filter="url(#glow)" />
  <circle cx="50" cy="46" r="2.5" fill="#FFFFFF" />
</svg>
